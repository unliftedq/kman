name: release

# Publishes @unliftedq/kman to npm and creates a GitHub Release when a
# semver tag like `v1.2.3` is pushed. The tag's version MUST match
# apps/cli/package.json — the workflow exits early if they disagree so
# we never publish a mismatched version.
#
# Auth: uses npm Trusted Publishing via GitHub OIDC.
# No NPM_TOKEN is required. Before the first run, configure a trusted
# publisher on npmjs.com:
#   npmjs.com -> Package @unliftedq/kman -> Settings -> Trusted Publishers
#   -> Add GitHub Actions:
#       Organization or user: unliftedq
#       Repository:           kman
#       Workflow filename:    release.yml
#       Environment:          (leave blank)
#
# Required repo settings:
#   Settings -> Actions -> General -> Workflow permissions
#     - "Read and write permissions"  (needed for `gh release create`)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v0.0.3)'
        required: true

permissions:
  contents: write   # create GitHub release
  id-token: write   # npm provenance (OIDC)

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Node (Trusted Publishing OIDC needs npm >= 11.5.1; Node 24 ships with npm 11.x)
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify npm version
        run: npm --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve tag and verify version match
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid semver tag (expected vMAJOR.MINOR.PATCH[-prerelease])"
            exit 1
          fi
          TAG_VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./apps/cli/package.json').version")"
          if [[ "$TAG_VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($TAG_VERSION) does not match apps/cli/package.json version ($PKG_VERSION). Bump package.json and re-tag."
            exit 1
          fi
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          # npm dist-tag: prerelease versions go to "next", everything else to "latest"
          if [[ "$PKG_VERSION" == *"-"* ]]; then
            echo "npm_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build CLI
        run: bun run --filter @unliftedq/kman build

      - name: Verify bin works
        run: node apps/cli/dist/main.js --version

      - name: Refuse to publish if version already exists on npm
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          if npm view "@unliftedq/kman@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::@unliftedq/kman@${VERSION} is already published on npm."
            exit 1
          fi

      - name: Publish to npm
        # Uses npm Trusted Publishing via GitHub OIDC; no registry token is required.
        # `bun pm pack` rewrites workspace:* / catalog: protocols to concrete versions
        # in the tarball manifest; we then assert no workspace/catalog refs survive
        # before handing the .tgz to `npm publish` for the OIDC exchange + upload.
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cli
          pack_dir="$(mktemp -d)"
          bun pm pack --destination "${pack_dir}"
          package_file="$(find "${pack_dir}" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "${package_file}"

          tar -xOf "${package_file}" package/package.json > "${pack_dir}/package.json"
          node -e '
            const manifest = require(process.argv[1]);
            const groups = ["dependencies", "devDependencies", "peerDependencies", "optionalDependencies"];
            for (const group of groups) {
              for (const [name, version] of Object.entries(manifest[group] ?? {})) {
                if (typeof version === "string" && /^(catalog|workspace):/.test(version)) {
                  throw new Error(`${group}.${name} was not rewritten before publish: ${version}`);
                }
              }
            }
          ' "${pack_dir}/package.json"

          npm publish "${package_file}" \
            --access=public \
            --provenance \
            --tag="${{ steps.ver.outputs.npm_tag }}"